[package]
name = "ghidrai"
version = "0.7.1"
edition = "2024"
description = "Open-source terminal reverse engineering TUI toolkit aggregator."
license = "GPL-3.0-or-later"
repository = "https://github.com/Wang-Yang-source/ghidrai"
keywords = ["reverse-engineering", "tui", "ghidra", "rizin", "binary-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
zip = "0.6"
futures-util = "0.3"
syntect = "5.3.0"
goblin = "0.10.7"
iced-x86 = "1.21.0"
memmap2 = "0.9.10"
binwalk = { version = "3.1.0", path = "third_party/binwalk", optional = true }

[features]
default = ["binwalk"]
binwalk = ["dep:binwalk"]

[package.metadata.docs.rs]
# docs.rs cannot resolve the vendored path dependency; build without it.
no-default-features = true
