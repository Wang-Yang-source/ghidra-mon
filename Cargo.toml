[package]
name = "revisor"
version = "0.6.0"
edition = "2024"
description = "Terminal IDE and AI MCP Unified Binary for seamless reverse engineering workflows."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wang-Yang-source/ghidra-mon"
keywords = ["ghidra", "reverse-engineering", "mcp", "tui", "ai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
zip = "0.6"
futures-util = "0.3"
syntect = "5.3.0"
goblin = "0.10.7"
